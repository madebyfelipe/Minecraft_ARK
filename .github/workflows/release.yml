name: Release

# Uma tag v* publica o release: compila, monta o .mrpack (tools/build_mrpack.py) e anexa o .mrpack e o jar.
# As notas vêm de docs/releases/<tag>.md; a versão do gradle.properties precisa bater com a tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com mod_version=$version" >&2
            exit 1
          fi
          test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build modpack
        run: python3 tools/build_mrpack.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/modpack/IceAgeSurvival-$version.mrpack" \
            "build/libs/iceagesurvival-$version.jar" \
            --title "Ice Age Survival $version (alfa)" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --prerelease
