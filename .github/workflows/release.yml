name: Release

# Publica o release da versão do gradle.properties: compila, monta o .mrpack (tools/build_mrpack.py) e anexa o
# .mrpack e o jar, com as notas de docs/releases/v<versão>.md. Dispara com uma tag v* ou à mão (workflow_dispatch);
# à mão, a tag v<versão> é criada no commit escolhido.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com mod_version=$version" >&2
            exit 1
          fi
          test -f "docs/releases/v$version.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build modpack
        run: python3 tools/build_mrpack.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/modpack/IceAgeSurvival-$VERSION.mrpack" \
            "build/libs/iceagesurvival-$VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "Ice Age Survival $VERSION (alfa)" \
            --notes-file "docs/releases/v$VERSION.md" \
            --prerelease
