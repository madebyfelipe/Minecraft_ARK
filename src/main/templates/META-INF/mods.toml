modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Felipe Silva"
description='''
Sobrevivência e domesticação de criaturas pré-históricas em uma Era do Gelo.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fossil"
    mandatory=true
    versionRange="[${fossils_mod_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="morehitboxes"
    mandatory=true
    versionRange="[${morehitboxes_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    mandatory=false
    versionRange="[3.2,)"
    ordering="AFTER"
    side="BOTH"

# Jurassic Reborn e Prehistoric Fauna: opcionais, só fornecedores de assets (D21). O AFTER faz o nosso
# pacote de dados carregar depois dos deles, para os arquivos que desligam o conteúdo deles vencerem (D22).
[[dependencies.${mod_id}]]
    modId="jurassicreborn"
    mandatory=false
    versionRange="[1.4.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="prehistoricfauna"
    mandatory=false
    versionRange="[2.3.3,)"
    ordering="AFTER"
    side="BOTH"
